# Local development stack: MongoDB + the Robe-Rent API.
# Usage: docker compose up --build
# Then bootstrap an admin: docker compose exec server npm run seed:admin
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/robe-rent
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:5173}
      BOOKING_BUFFER_DAYS: ${BOOKING_BUFFER_DAYS:-1}
      MIN_RENTAL_DAYS: ${MIN_RENTAL_DAYS:-1}
      MAX_RENTAL_DAYS: ${MAX_RENTAL_DAYS:-30}
      DEFAULT_PHONE_COUNTRY: ${DEFAULT_PHONE_COUNTRY:-TN}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}

volumes:
  mongo-data:
